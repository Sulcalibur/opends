<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenDS — Design exploration</title>
<link rel="stylesheet" href="styles/tokens.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  .dc-card { background: transparent !important; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="components/icons.jsx"></script>
<script type="text/babel" src="components/primitives.jsx"></script>
<script type="text/babel" src="components/layouts.jsx"></script>

<script type="text/babel" src="screens/admin-visibility.jsx"></script>
<script type="text/babel" src="screens/public-home.jsx"></script>
<script type="text/babel" src="screens/public-component.jsx"></script>
<script type="text/babel" src="screens/public-token.jsx"></script>
<script type="text/babel" src="screens/public-docs.jsx"></script>
<script type="text/babel" src="screens/public-restricted.jsx"></script>

<script type="text/babel" src="screens/admin-dashboard.jsx"></script>
<script type="text/babel" src="screens/admin-components.jsx"></script>
<script type="text/babel" src="screens/admin-component-editor.jsx"></script>
<script type="text/babel" src="screens/admin-tokens.jsx"></script>
<script type="text/babel" src="screens/admin-docs-editor.jsx"></script>
<script type="text/babel" src="screens/admin-users.jsx"></script>
<script type="text/babel" src="screens/admin-settings.jsx"></script>

<script type="text/babel" src="screens/admin-new-component.jsx"></script>
<script type="text/babel" src="screens/admin-new-doc.jsx"></script>
<script type="text/babel" src="screens/admin-new-token.jsx"></script>

<script type="text/babel" src="screens/auth-login.jsx"></script>
<script type="text/babel" src="screens/cmd-k.jsx"></script>

<script type="text/babel" src="screens/mobile.jsx"></script>
<script type="text/babel" src="screens/mobile-admin.jsx"></script>
<script type="text/babel" src="screens/tablet.jsx"></script>

<script type="text/babel">
const App = () => (
  <DesignCanvas>
    <DCSection id="public" title="Public docs · Lumen Design System" subtitle="The team-facing surface — read-only, hosted on OpenDS · Sweet Salmon system, light theme">
      <DCArtboard id="home" label="01 · Home (lumen.opends.dev)" width={1440} height={1300}>
        <PublicHome />
      </DCArtboard>
      <DCArtboard id="component" label="02 · Component page (Button)" width={1440} height={1850}>
        <PublicComponent />
      </DCArtboard>
      <DCArtboard id="token" label="03 · Tokens · Color" width={1440} height={1650}>
        <PublicToken />
      </DCArtboard>
      <DCArtboard id="docs" label="04 · Docs page (Markdown)" width={1440} height={1700}>
        <PublicDocs />
      </DCArtboard>
    </DCSection>

    <DCSection id="admin" title="Admin dashboard" subtitle="The OpenDS platform UI — where the team manages their design system">
      <DCArtboard id="dashboard" label="05 · Dashboard" width={1440} height={950}>
        <AdminDashboard />
      </DCArtboard>
      <DCArtboard id="comp-list" label="06 · Components list" width={1440} height={1100}>
        <AdminComponents />
      </DCArtboard>
      <DCArtboard id="comp-edit" label="07 · Component editor" width={1440} height={950}>
        <AdminComponentEditor />
      </DCArtboard>
      <DCArtboard id="tokens" label="08 · Token editor" width={1440} height={950}>
        <AdminTokens />
      </DCArtboard>
      <DCArtboard id="docs-edit" label="09 · Docs WYSIWYG editor" width={1440} height={950}>
        <AdminDocsEditor />
      </DCArtboard>
      <DCArtboard id="users" label="10 · Users & Roles" width={1440} height={950}>
        <AdminUsers />
      </DCArtboard>
      <DCArtboard id="settings" label="11 · Settings" width={1440} height={950}>
        <AdminSettings />
      </DCArtboard>
    </DCSection>

    <DCSection id="auth" title="Auth & overlays" subtitle="First-touch surfaces — login and ⌘K search">
      <DCArtboard id="login" label="12 · Login" width={1440} height={900}>
        <AuthLogin />
      </DCArtboard>
      <DCArtboard id="cmdk" label="13 · ⌘K search overlay" width={1440} height={900}>
        <CmdK />
      </DCArtboard>
    </DCSection>

    <DCSection id="contribute" title="Contribute · Add to the system" subtitle="The creation flows when the team adds something new. Each lands from the Dashboard's Quick Actions or a sidebar shortcut.">
      <DCArtboard id="new-component" label="14 · New component" width={1440} height={1450}>
        <AdminNewComponent />
      </DCArtboard>
      <DCArtboard id="new-doc-split" label="15a · New doc — Split (raw + preview)" width={1440} height={1050}>
        <AdminNewDocSplit />
      </DCArtboard>
      <DCArtboard id="new-doc-hybrid" label="15b · New doc — Hybrid (inline)" width={1440} height={1050}>
        <AdminNewDocHybrid />
      </DCArtboard>
      <DCArtboard id="new-token" label="16 · New token + import" width={1440} height={1450}>
        <AdminNewToken />
      </DCArtboard>
    </DCSection>

    <DCSection id="access" title="Access · Public · Team · Admin" subtitle="The three audiences and how the team controls them. Public reads the docs, Team contributes, Admins manage. Visibility is per-page; comments are an independent per-audience toggle.">
      <DCArtboard id="visibility" label="17 · Visibility & access matrix" width={1440} height={1180}>
        <AdminVisibility />
      </DCArtboard>
      <DCArtboard id="restricted" label="18 · Public · team-only page (signed out)" width={1440} height={900}>
        <PublicRestricted />
      </DCArtboard>
    </DCSection>

    <DCSection id="tablet" title="Tablet · 834px" subtitle="iPad portrait. Sidebar collapses to icon rail on admin; right TOC drops; grids reflow to 2–3 columns.">
      <DCArtboard id="t-home" label="T01 · Home" width={834} height={1300}>
        <TabletPublicHome />
      </DCArtboard>
      <DCArtboard id="t-component" label="T02 · Component (Button)" width={834} height={1500}>
        <TabletComponent />
      </DCArtboard>
      <DCArtboard id="t-token" label="T03 · Tokens · Color" width={834} height={1200}>
        <TabletToken />
      </DCArtboard>
      <DCArtboard id="t-dashboard" label="T04 · Admin Dashboard" width={834} height={1200}>
        <TabletAdminDashboard />
      </DCArtboard>
      <DCArtboard id="t-components" label="T05 · Components list" width={834} height={1200}>
        <TabletAdminComponents />
      </DCArtboard>
    </DCSection>

    <DCSection id="mobile" title="Mobile · 375px" subtitle="Single column everywhere. Sidebar becomes hamburger drawer; right TOC is gone; admin uses bottom nav.">
      <DCArtboard id="m-home" label="M01 · Home" width={375} height={1500}>
        <MobilePublicHome />
      </DCArtboard>
      <DCArtboard id="m-component" label="M02 · Component (Button)" width={375} height={1500}>
        <MobileComponent />
      </DCArtboard>
      <DCArtboard id="m-token" label="M03 · Tokens · Color" width={375} height={1400}>
        <MobileToken />
      </DCArtboard>
      <DCArtboard id="m-docs" label="M04 · Docs (Markdown)" width={375} height={1500}>
        <MobileDocs />
      </DCArtboard>
      <DCArtboard id="m-dashboard" label="M05 · Admin Dashboard" width={375} height={1500}>
        <MobileAdminDashboard />
      </DCArtboard>
      <DCArtboard id="m-login" label="M06 · Login" width={375} height={812}>
        <MobileLogin />
      </DCArtboard>
      <DCArtboard id="m-cmdk" label="M07 · Search" width={375} height={812}>
        <MobileCmdK />
      </DCArtboard>
      <DCArtboard id="m-admin-components" label="M08 · Admin · Components" width={375} height={1500}>
        <MobileAdminComponents />
      </DCArtboard>
      <DCArtboard id="m-admin-editor" label="M09 · Admin · Component editor" width={375} height={1700}>
        <MobileAdminComponentEditor />
      </DCArtboard>
      <DCArtboard id="m-admin-tokens" label="M10 · Admin · Tokens" width={375} height={1900}>
        <MobileAdminTokens />
      </DCArtboard>
      <DCArtboard id="m-admin-docs" label="M11 · Admin · Docs editor" width={375} height={1500}>
        <MobileAdminDocsEditor />
      </DCArtboard>
      <DCArtboard id="m-admin-users" label="M12 · Admin · Users" width={375} height={1400}>
        <MobileAdminUsers />
      </DCArtboard>
      <DCArtboard id="m-admin-settings" label="M13 · Admin · Settings" width={375} height={1700}>
        <MobileAdminSettings />
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
