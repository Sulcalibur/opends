# PocketBase adds auth, database, and real-time as a single binary
# OpenDS Nuxt app becomes the custom frontend over PocketBase's API
version: '3.8'

services:
  # PocketBase — auth, database, file storage, real-time
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    container_name: opends-pocketbase
    restart: unless-stopped
    ports:
      - '8090:8090'
    volumes:
      - pocketbase_data:/pb_data
      - ./pb_migrations:/pb_migrations
    environment:
      # Auto-create admin on first run
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:-admin@opends.local}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:-admin}
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8090/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenDS Application — custom admin UI, MCP, code gen, search
  opends:
    build: .
    container_name: opends-app
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      # PocketBase connection
      POCKETBASE_URL: http://pocketbase:8090

      # Application
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0

      # Registration
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}

      # Optional: Default admin user (PocketBase handles auth, but seed data)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pocketbase_data:
    driver: local
  app_data:
    driver: local
