name: Build & publish Docker image

# OPDS-32 — Part 5 (clean download): publish the OpenDS app image so users
# pull it instead of building from source.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Image name is computed in the job (lowercased for GHCR).

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase for GHCR)
        id: image
        run: |
          REPO="${{ github.repository }}"
          echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Compute tags
        id: tags
        run: |
          NAME="${{ steps.image.outputs.name }}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tags=$NAME:$VERSION, $NAME:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$NAME:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    # Boot the published image standalone in SQLite mode and check /api/health,
    # so a broken image never reaches the :latest tag users pull.
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Compute image name
        id: image
        run: |
          REPO="${{ github.repository }}"
          echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run image smoke test
        run: |
          IMAGE="${{ steps.image.outputs.name }}:latest"
          docker run -d --name opends-smoke \
            -e POCKETBASE_URL='' \
            -e DATABASE_URL=sqlite:/tmp/opends-smoke.db \
            -e JWT_SECRET=smoke-test-secret \
            -p 3112:3000 \
            "$IMAGE"
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3112/api/health; then
              echo "SMOKE OK"
              docker rm -f opends-smoke
              exit 0
            fi
            sleep 2
          done
          docker logs opends-smoke
          echo "SMOKE FAILED: /api/health never became healthy"
          docker rm -f opends-smoke
          exit 1
